[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "samviewer"
version = "0.1.0"
description = "Camera alignment viewer for approximate real/reference viewpoint matching."
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.34",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "Pillow>=10.0",
]

[project.scripts]
samviewer = "samviewer.app:main"

[tool.setuptools.packages.find]
where = ["src"]
